services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unitrack
      POSTGRES_USER: unitrack
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - unitrack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unitrack -d unitrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://unitrack:change-me-local-only@postgres:5432/unitrack
      SESSION_SECRET: replace-with-a-real-secret-before-use
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  unitrack-postgres:
